<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Neon Invaders — Danny's Arcade</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #04020c; overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #eaf6ff; user-select: none; -webkit-user-select: none;
  }
  #game { position: fixed; inset: 0; display: block; touch-action: none; cursor: crosshair; }
  .corner-btn {
    position: fixed; top: 12px; z-index: 30; width: 44px; height: 44px;
    border-radius: 12px; border: 1px solid rgba(120,220,255,.35);
    background: rgba(10,16,38,.72); color: #bfeaff; font-size: 19px; line-height: 1;
    cursor: pointer; backdrop-filter: blur(4px);
  }
  .corner-btn:hover { background: rgba(24,40,80,.85); }
  #muteBtn { right: 12px; }
  #pauseBtn { right: 64px; }
  /* ---------- start screen ---------- */
  #startScreen {
    position: fixed; inset: 0; z-index: 20; display: flex;
    align-items: center; justify-content: center; text-align: center;
    background:
      radial-gradient(900px 480px at 50% 118%, rgba(255,61,240,.20), transparent 60%),
      radial-gradient(1000px 620px at 50% -10%, rgba(39,120,255,.22), transparent 60%),
      linear-gradient(180deg, rgba(4,2,16,.55), rgba(4,2,16,.82));
    padding: 20px;
  }
  #startScreen.hidden { display: none; }
  .panel { max-width: 640px; }
  h1.title {
    font-size: clamp(44px, 9vw, 84px); font-weight: 900; letter-spacing: 3px; line-height: 1;
    background: linear-gradient(92deg, #27e8ff 5%, #7df9ff 30%, #ff3df0 68%, #ffb02e 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 22px rgba(39,232,255,.35));
  }
  .tagline { margin-top: 12px; font-size: clamp(15px, 2.6vw, 20px); color: #cfe9ff; }
  .tagline b { color: #7df9ff; }
  .controls {
    margin: 26px auto 4px; display: inline-block; text-align: left;
    font-size: clamp(13px, 2.2vw, 16px); line-height: 1.9; color: #a9c6e8;
  }
  .controls span { color: #eaf6ff; font-weight: 600; }
  #startBtn {
    margin-top: 26px; font-size: clamp(19px, 3vw, 24px); font-weight: 800; letter-spacing: 2px;
    color: #06121f; background: linear-gradient(92deg, #27e8ff, #2bff88);
    border: none; border-radius: 999px; padding: 15px 52px; cursor: pointer;
    box-shadow: 0 0 28px rgba(39,232,255,.55), 0 6px 18px rgba(0,0,0,.5);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  #startBtn:hover, #startBtn:focus { transform: translateY(-2px) scale(1.03); box-shadow: 0 0 40px rgba(43,255,136,.6), 0 8px 22px rgba(0,0,0,.5); }
  #bestLine { margin-top: 18px; font-size: 14px; color: #8fb4d9; letter-spacing: 1px; min-height: 18px; }
  .backlink { margin-top: 26px; font-size: 13px; }
  .backlink a { color: #7d72a8; text-decoration: none; }
  .backlink a:hover { color: #bdb2e8; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<button id="pauseBtn" class="corner-btn" title="Pause (P)">&#10073;&#10073;</button>
<button id="muteBtn" class="corner-btn" title="Mute (M)">&#128266;</button>

<div id="startScreen">
  <div class="panel">
    <h1 class="title">NEON INVADERS</h1>
    <p class="tagline">Space Invaders, rebuilt &mdash; <b>unlimited ships</b>, endless waves.</p>
    <div class="controls">
      <div><span>Move</span> &mdash; &#8592; &#8594; keys, A / D, stick, or just point</div>
      <div><span>Fire</span> &mdash; hold SPACE, hold the pointer down, or hold a trigger</div>
      <div><span>Pause</span> &mdash; P &nbsp;&middot;&nbsp; <span>Mute</span> &mdash; M</div>
    </div>
    <br>
    <button id="startBtn">&#9654; START</button>
    <div id="bestLine"></div>
    <div class="backlink"><a href="./">&#8592; Danny's Arcade</a></div>
  </div>
</div>

<script>
'use strict';
/* ============================================================
   NEON INVADERS — a modern Space Invaders with unlimited lives.
   Pure Canvas 2D + vanilla JS. No external assets, ever.
   ============================================================ */

// ---------- virtual stage ----------
var VW = 900, VH = 700;              // fixed logic resolution
var GROUND_Y = 668;                  // glowing floor line
var PLAYER_Y = 640;                  // player ship centre line

var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');
var view = { scale: 1, ox: 0, oy: 0, dpr: 1 };

function resize() {
  view.dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(window.innerWidth * view.dpr);
  canvas.height = Math.round(window.innerHeight * view.dpr);
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  view.scale = Math.min(window.innerWidth / VW, window.innerHeight / VH);
  view.ox = (window.innerWidth - VW * view.scale) / 2;
  view.oy = (window.innerHeight - VH * view.scale) / 2;
}
window.addEventListener('resize', resize);
resize();

// ---------- small helpers ----------
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function rand(a, b) { return a + Math.random() * (b - a); }
function randi(a, b) { return Math.floor(rand(a, b + 1)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

// ---------- sprite factory (pre-rendered, supersampled) ----------
var SS = 2; // supersample factor for crisp glow sprites
function makeSprite(w, h, draw) {
  var c = document.createElement('canvas');
  c.width = Math.ceil(w * SS); c.height = Math.ceil(h * SS);
  var g = c.getContext('2d');
  g.scale(SS, SS);
  draw(g, w, h);
  return c;
}
function blit(sprite, x, y, w, h) { ctx.drawImage(sprite, x, y, w, h); }

// soft radial glow dot, tinted per palette colour
function glowDotSprite(color) {
  return makeSprite(32, 32, function (g) {
    var gr = g.createRadialGradient(16, 16, 0, 16, 16, 16);
    gr.addColorStop(0, '#ffffff');
    gr.addColorStop(0.25, color);
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr;
    g.fillRect(0, 0, 32, 32);
  });
}
var PALETTE = ['#27e8ff', '#ff3df0', '#9d5cff', '#2bff88', '#ffb02e', '#ff5470', '#ffffff'];
var glowDots = {};
PALETTE.forEach(function (c) { glowDots[c] = glowDotSprite(c); });

// ---------- background: nebula + parallax star layers ----------
var nebula = makeSprite(VW, VH, function (g, w, h) {
  var base = g.createLinearGradient(0, 0, 0, h);
  base.addColorStop(0, '#050214');
  base.addColorStop(0.55, '#0a0630');
  base.addColorStop(1, '#160a33');
  g.fillStyle = base; g.fillRect(0, 0, w, h);
  function blob(x, y, r, color, alpha) {
    var gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, color);
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.save(); g.globalAlpha = alpha; g.fillStyle = gr;
    g.fillRect(x - r, y - r, r * 2, r * 2); g.restore();
  }
  blob(190, 150, 300, '#274bff', 0.30);
  blob(720, 110, 260, '#ff3df0', 0.16);
  blob(640, 430, 340, '#123a8f', 0.28);
  blob(150, 520, 280, '#5b1e9e', 0.22);
  blob(460, 300, 200, '#27e8ff', 0.10);
});
function starLayer(count, maxR) {
  return makeSprite(VW, VH, function (g, w, h) {
    for (var i = 0; i < count; i++) {
      var x = Math.random() * w, y = Math.random() * h;
      var r = 0.5 + Math.random() * maxR;
      g.globalAlpha = 0.35 + Math.random() * 0.65;
      g.fillStyle = Math.random() < 0.12 ? '#bfeaff' : '#ffffff';
      g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fill();
    }
    g.globalAlpha = 1;
  });
}
var starsFar = starLayer(110, 0.9);
var starsMid = starLayer(70, 1.4);
var starsNear = starLayer(36, 2.0);
var starScroll = [0, 0, 0];
var STAR_SPEEDS = [4, 11, 26]; // px per second, far -> near

// ---------- player ship sprite ----------
var SHIP_W = 62, SHIP_H = 46;
var shipSprite = makeSprite(SHIP_W, SHIP_H, function (g, w, h) {
  g.translate(w / 2, h / 2);
  g.shadowColor = '#27e8ff'; g.shadowBlur = 14;
  // swept wings
  var wing = g.createLinearGradient(0, -20, 0, 20);
  wing.addColorStop(0, '#9beaff'); wing.addColorStop(0.5, '#1d7fd6'); wing.addColorStop(1, '#0b3f7e');
  g.fillStyle = wing;
  g.beginPath();
  g.moveTo(0, -21);
  g.bezierCurveTo(5, -12, 8, -4, 10, 4);
  g.lineTo(29, 16); g.lineTo(30, 21); g.lineTo(12, 18);
  g.lineTo(7, 21); g.lineTo(-7, 21); g.lineTo(-12, 18);
  g.lineTo(-30, 21); g.lineTo(-29, 16); g.lineTo(-10, 4);
  g.bezierCurveTo(-8, -4, -5, -12, 0, -21);
  g.fill();
  // fuselage spine
  g.shadowBlur = 8;
  var spine = g.createLinearGradient(0, -22, 0, 16);
  spine.addColorStop(0, '#eafcff'); spine.addColorStop(0.6, '#57c8f5'); spine.addColorStop(1, '#1663ad');
  g.fillStyle = spine;
  g.beginPath();
  g.moveTo(0, -22);
  g.bezierCurveTo(4.5, -10, 5.5, 2, 4, 14);
  g.lineTo(-4, 14);
  g.bezierCurveTo(-5.5, 2, -4.5, -10, 0, -22);
  g.fill();
  // cockpit core
  g.shadowColor = '#ffffff'; g.shadowBlur = 10;
  g.fillStyle = '#eaffff';
  g.beginPath(); g.ellipse(0, -6, 2.6, 6.5, 0, 0, 6.2832); g.fill();
  // wing tip lights
  g.shadowColor = '#ff3df0'; g.shadowBlur = 9; g.fillStyle = '#ff9df7';
  g.beginPath(); g.arc(-28.5, 18.5, 2.2, 0, 6.2832); g.fill();
  g.beginPath(); g.arc(28.5, 18.5, 2.2, 0, 6.2832); g.fill();
});

// ---------- invader sprites: 5 rows, 5 designs ----------
var INV_W = 50, INV_H = 38;
var ROW_STYLE = [
  { color: '#ff3df0', points: 30 },  // top row: magenta dart
  { color: '#9d5cff', points: 20 },  // violet cruiser
  { color: '#27e8ff', points: 20 },  // cyan stingray
  { color: '#2bff88', points: 10 },  // green beetle-drone
  { color: '#ffb02e', points: 10 }   // amber saucer-drone
];
function invaderSprite(kind, color) {
  return makeSprite(INV_W, INV_H, function (g, w, h) {
    g.translate(w / 2, h / 2);
    g.shadowColor = color; g.shadowBlur = 11;
    g.fillStyle = color;
    g.strokeStyle = color; g.lineWidth = 2.4; g.lineJoin = 'round';
    if (kind === 0) {            // dart: sharp arrowhead ship
      g.beginPath();
      g.moveTo(0, 15); g.lineTo(-6, 2); g.lineTo(-21, 8); g.lineTo(-15, -6);
      g.lineTo(-5, -3); g.lineTo(0, -16); g.lineTo(5, -3); g.lineTo(15, -6);
      g.lineTo(21, 8); g.lineTo(6, 2); g.closePath(); g.fill();
    } else if (kind === 1) {     // cruiser: wide wing + prongs
      g.beginPath();
      g.moveTo(-23, 6); g.lineTo(-12, -2); g.lineTo(-9, -13); g.lineTo(-3, -6);
      g.lineTo(3, -6); g.lineTo(9, -13); g.lineTo(12, -2); g.lineTo(23, 6);
      g.lineTo(15, 13); g.lineTo(4, 8); g.lineTo(-4, 8); g.lineTo(-15, 13);
      g.closePath(); g.fill();
      g.beginPath(); g.moveTo(-17, 10); g.lineTo(-17, 16); g.moveTo(17, 10); g.lineTo(17, 16); g.stroke();
    } else if (kind === 2) {     // stingray: smooth manta curve
      g.beginPath();
      g.moveTo(0, -13);
      g.bezierCurveTo(10, -13, 20, -6, 24, 6);
      g.bezierCurveTo(14, 4, 8, 8, 5, 15);
      g.lineTo(0, 10); g.lineTo(-5, 15);
      g.bezierCurveTo(-8, 8, -14, 4, -24, 6);
      g.bezierCurveTo(-20, -6, -10, -13, 0, -13);
      g.fill();
    } else if (kind === 3) {     // beetle-drone: dome + legs
      g.beginPath();
      g.moveTo(-14, 8);
      g.bezierCurveTo(-15, -8, -8, -15, 0, -15);
      g.bezierCurveTo(8, -15, 15, -8, 14, 8);
      g.lineTo(7, 8); g.lineTo(4, 2); g.lineTo(-4, 2); g.lineTo(-7, 8);
      g.closePath(); g.fill();
      g.beginPath();
      g.moveTo(-13, 4); g.lineTo(-20, 12); g.moveTo(-6, 8); g.lineTo(-8, 16);
      g.moveTo(6, 8); g.lineTo(8, 16); g.moveTo(13, 4); g.lineTo(20, 12); g.stroke();
    } else {                    // saucer-drone: disc + dome
      g.beginPath(); g.ellipse(0, 4, 23, 7.5, 0, 0, 6.2832); g.fill();
      g.beginPath();
      g.moveTo(-10, 2);
      g.bezierCurveTo(-9, -11, -4, -15, 0, -15);
      g.bezierCurveTo(4, -15, 9, -11, 10, 2);
      g.closePath(); g.fill();
      g.beginPath(); g.moveTo(-14, 12); g.lineTo(-11, 16); g.moveTo(0, 13); g.lineTo(0, 17); g.moveTo(14, 12); g.lineTo(11, 16); g.stroke();
    }
    // glowing core (all kinds)
    g.shadowColor = '#ffffff'; g.shadowBlur = 12;
    g.fillStyle = '#ffffff';
    g.beginPath(); g.arc(0, kind === 4 ? -5 : 0, 3.1, 0, 6.2832); g.fill();
  });
}
var invaderSprites = ROW_STYLE.map(function (s, i) { return invaderSprite(i, s.color); });

// ---------- mothership sprite ----------
var MOTH_W = 92, MOTH_H = 40;
var mothSprite = makeSprite(MOTH_W, MOTH_H, function (g, w, h) {
  g.translate(w / 2, h / 2);
  g.shadowColor = '#ff5470'; g.shadowBlur = 16;
  var hull = g.createLinearGradient(0, -14, 0, 14);
  hull.addColorStop(0, '#ffd7de'); hull.addColorStop(0.45, '#ff5470'); hull.addColorStop(1, '#8f1030');
  g.fillStyle = hull;
  g.beginPath(); g.ellipse(0, 5, 44, 11, 0, 0, 6.2832); g.fill();
  g.beginPath();
  g.moveTo(-17, 0);
  g.bezierCurveTo(-15, -15, -7, -19, 0, -19);
  g.bezierCurveTo(7, -19, 15, -15, 17, 0);
  g.closePath(); g.fill();
  g.shadowBlur = 0; g.fillStyle = '#fff3f5';
  [-30, -15, 0, 15, 30].forEach(function (x) {
    g.beginPath(); g.arc(x, 6, 2.6, 0, 6.2832); g.fill();
  });
  g.fillStyle = '#ffe27a';
  g.beginPath(); g.arc(0, -10, 3.4, 0, 6.2832); g.fill();
});

// ---------- projectile sprites ----------
var boltSprite = makeSprite(8, 26, function (g) {
  var gr = g.createLinearGradient(0, 0, 0, 26);
  gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.35, '#9beaff'); gr.addColorStop(1, 'rgba(39,232,255,0)');
  g.shadowColor = '#27e8ff'; g.shadowBlur = 8;
  g.fillStyle = gr;
  g.beginPath();
  g.moveTo(4, 0); g.lineTo(7, 8); g.lineTo(5.6, 24); g.lineTo(2.4, 24); g.lineTo(1, 8);
  g.closePath(); g.fill();
});
var bombSprite = makeSprite(18, 18, function (g) {
  var gr = g.createRadialGradient(9, 9, 0, 9, 9, 9);
  gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.35, '#ffb0a0');
  gr.addColorStop(0.7, '#ff4040'); gr.addColorStop(1, 'rgba(255,40,40,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 18, 18);
});
// ---------- audio: tiny WebAudio synth, created on first gesture ----------
var AudioSys = {
  ctx: null, master: null, muted: false, noiseBuf: null,
  init: function () {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.5;
      this.master.connect(this.ctx.destination);
      var len = this.ctx.sampleRate;
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      var d = this.noiseBuf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { this.ctx = null; }
  },
  tone: function (f0, f1, dur, type, vol, delay) {
    if (!this.ctx || this.muted) return;
    var t = this.ctx.currentTime + (delay || 0);
    var o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },
  noise: function (dur, vol, freq, delay) {
    if (!this.ctx || this.muted) return;
    var t = this.ctx.currentTime + (delay || 0);
    var src = this.ctx.createBufferSource(); src.buffer = this.noiseBuf;
    src.loop = true;
    var f = this.ctx.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(freq, t);
    f.frequency.exponentialRampToValueAtTime(60, t + dur);
    var g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + dur + 0.02);
  },
  laser: function () { this.tone(920, 180, 0.14, 'sawtooth', 0.10); },
  blip: function () { this.tone(340, 70, 0.09, 'triangle', 0.16); this.noise(0.06, 0.05, 2400); },
  boom: function (big) {
    this.noise(big ? 0.55 : 0.32, big ? 0.5 : 0.3, big ? 900 : 1200);
    this.tone(big ? 130 : 110, 34, big ? 0.5 : 0.3, 'sine', big ? 0.55 : 0.35);
  },
  warble: function (hi) { this.tone(hi ? 660 : 470, hi ? 660 : 470, 0.09, 'sine', 0.07); },
  thud: function () { this.tone(90, 40, 0.2, 'sine', 0.3); this.noise(0.16, 0.2, 500); }
};

// ---------- input ----------
var keys = {};
var pointer = { active: false, down: false, x: VW / 2, seen: false };
function toVirtual(clientX, clientY) {
  return {
    x: (clientX - view.ox) / view.scale,
    y: (clientY - view.oy) / view.scale
  };
}
window.addEventListener('keydown', function (e) {
  AudioSys.init();
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].indexOf(e.code) >= 0) e.preventDefault();
  keys[e.code] = true;
  if (e.code === 'KeyM') toggleMute();
  if (e.code === 'KeyP') togglePause();
});
window.addEventListener('keyup', function (e) { keys[e.code] = false; });
canvas.addEventListener('pointermove', function (e) {
  var p = toVirtual(e.clientX, e.clientY);
  pointer.x = p.x; pointer.seen = true; pointer.active = true;
});
canvas.addEventListener('pointerdown', function (e) {
  AudioSys.init();
  var p = toVirtual(e.clientX, e.clientY);
  pointer.x = p.x; pointer.seen = true; pointer.active = true; pointer.down = true;
  canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
});
window.addEventListener('pointerup', function () { pointer.down = false; });
window.addEventListener('pointercancel', function () { pointer.down = false; });
document.addEventListener('visibilitychange', function () {
  if (document.hidden && state.mode === 'play' && !state.paused) setPaused(true);
});

// gamepad snapshot, refreshed each frame (null-safe)
var pad = { move: 0, fire: false };
function pollGamepad() {
  pad.move = 0; pad.fire = false;
  if (!navigator.getGamepads) return;
  var gps = navigator.getGamepads();
  for (var i = 0; i < gps.length; i++) {
    var gp = gps[i];
    if (!gp) continue;
    var ax = gp.axes && gp.axes.length ? gp.axes[0] : 0;
    if (Math.abs(ax) > 0.24) pad.move = clamp(ax * 1.4, -1, 1);
    if (gp.buttons) {
      if (gp.buttons[14] && gp.buttons[14].pressed) pad.move = -1;
      if (gp.buttons[15] && gp.buttons[15].pressed) pad.move = 1;
      if ((gp.buttons[0] && gp.buttons[0].pressed) || (gp.buttons[7] && gp.buttons[7].pressed)) pad.fire = true;
    }
    if (pad.move !== 0 || pad.fire) break;
  }
}

// ---------- particles (pooled) ----------
var MAX_PARTICLES = 700;
var particles = [];
for (var pi = 0; pi < MAX_PARTICLES; pi++) {
  particles.push({ alive: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, size: 4, color: '#ffffff', grav: 0, drag: 1 });
}
function spawnParticles(x, y, color, count, speed, life, size, grav) {
  var spawned = 0;
  for (var i = 0; i < MAX_PARTICLES && spawned < count; i++) {
    var p = particles[i];
    if (p.alive) continue;
    var a = Math.random() * 6.2832, s = speed * (0.25 + Math.random() * 0.95);
    p.alive = true; p.x = x; p.y = y;
    p.vx = Math.cos(a) * s; p.vy = Math.sin(a) * s;
    p.max = p.life = life * (0.5 + Math.random() * 0.8);
    p.size = size * (0.5 + Math.random() * 0.9);
    p.color = color; p.grav = grav || 0; p.drag = 0.92;
    spawned++;
  }
}
function updateParticles(dt) {
  for (var i = 0; i < MAX_PARTICLES; i++) {
    var p = particles[i];
    if (!p.alive) continue;
    p.life -= dt;
    if (p.life <= 0) { p.alive = false; continue; }
    var d = Math.pow(p.drag, dt * 60);
    p.vx *= d; p.vy = p.vy * d + p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
}
function drawParticles() {
  ctx.globalCompositeOperation = 'lighter';
  for (var i = 0; i < MAX_PARTICLES; i++) {
    var p = particles[i];
    if (!p.alive) continue;
    var t = p.life / p.max;
    var s = p.size * (0.5 + t);
    ctx.globalAlpha = t;
    ctx.drawImage(glowDots[p.color] || glowDots['#ffffff'], p.x - s, p.y - s, s * 2, s * 2);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

// ---------- shields: chunk-grid bunkers, re-rendered only when damaged ----------
var SHIELD_W = 84, SHIELD_H = 58, SHIELD_Y = 540, CELL = 6;
var SHIELD_COLS = Math.floor(SHIELD_W / CELL), SHIELD_ROWS = Math.floor(SHIELD_H / CELL);
var shields = [];
function shieldCellShape(r, c) {
  // classic bunker silhouette: rounded top corners, legs with a centre notch
  if (r < 2 && (c < 2 - r || c > SHIELD_COLS - 3 + r)) return false;
  if (r >= SHIELD_ROWS - 3 && c >= 5 && c <= SHIELD_COLS - 6) return false;
  return true;
}
function makeShield(x) {
  var cells = [], count = 0, r, c;
  for (r = 0; r < SHIELD_ROWS; r++) {
    cells.push([]);
    for (c = 0; c < SHIELD_COLS; c++) {
      var on = shieldCellShape(r, c);
      cells[r].push(on);
      if (on) count++;
    }
  }
  var cv = document.createElement('canvas');
  cv.width = SHIELD_W * SS; cv.height = SHIELD_H * SS;
  return { x: x, y: SHIELD_Y, cells: cells, count: count, canvas: cv, dirty: true };
}
function buildShields() {
  shields = [];
  var xs = [112, 322, 532, 742];
  for (var i = 0; i < 4; i++) shields.push(makeShield(xs[i]));
}
function renderShield(sh) {
  var g = sh.canvas.getContext('2d');
  g.setTransform(SS, 0, 0, SS, 0, 0);
  g.clearRect(0, 0, SHIELD_W, SHIELD_H);
  var grad = g.createLinearGradient(0, 0, 0, SHIELD_H);
  grad.addColorStop(0, '#4dffb8'); grad.addColorStop(1, '#0f9e63');
  g.fillStyle = grad;
  g.shadowColor = '#2bff88'; g.shadowBlur = 5;
  for (var r = 0; r < SHIELD_ROWS; r++) {
    for (var c = 0; c < SHIELD_COLS; c++) {
      if (!sh.cells[r][c]) continue;
      g.fillRect(c * CELL + 0.5, r * CELL + 0.5, CELL - 1, CELL - 1);
    }
  }
  sh.dirty = false;
}
function erodeShield(sh, px, py, radius) {
  // px, py in virtual coords; eats chunks in a circle; returns true if anything was eaten
  var lx = px - sh.x, ly = py - sh.y;
  if (lx < -radius || ly < -radius || lx > SHIELD_W + radius || ly > SHIELD_H + radius) return false;
  var hit = false;
  var r2 = radius * radius;
  for (var r = 0; r < SHIELD_ROWS; r++) {
    for (var c = 0; c < SHIELD_COLS; c++) {
      if (!sh.cells[r][c]) continue;
      var cx = c * CELL + CELL / 2, cy = r * CELL + CELL / 2;
      var dx = cx - lx, dy = cy - ly;
      if (dx * dx + dy * dy <= r2) { sh.cells[r][c] = false; sh.count--; hit = true; }
    }
  }
  if (hit) sh.dirty = true;
  return hit;
}
function pointInShield(px, py) {
  for (var i = 0; i < shields.length; i++) {
    var sh = shields[i];
    if (px >= sh.x && px <= sh.x + SHIELD_W && py >= sh.y && py <= sh.y + SHIELD_H) {
      var c = Math.floor((px - sh.x) / CELL), r = Math.floor((py - sh.y) / CELL);
      if (sh.cells[r] && sh.cells[r][c]) return sh;
    }
  }
  return null;
}
// ---------- game state ----------
var state = {
  mode: 'menu',          // 'menu' | 'play' — there is no end state: lives are unlimited
  paused: false,
  score: 0,
  high: 0,
  wave: 1,
  shipsLost: 0,
  time: 0,
  shake: 0,
  bannerText: '',
  bannerSub: '',
  bannerT: 0,
  waveTimer: -1          // >=0 while waiting to spawn the next formation
};
try { state.high = parseInt(localStorage.getItem('neonInvadersHigh') || '0', 10) || 0; } catch (e) { state.high = 0; }
function saveHigh() {
  if (state.score > state.high) {
    state.high = state.score;
    try { localStorage.setItem('neonInvadersHigh', String(state.high)); } catch (e) { /* storage is best-effort */ }
  }
}
function addScore(n) { state.score += n; saveHigh(); }
function showBanner(text, sub, dur) {
  state.bannerText = text; state.bannerSub = sub || ''; state.bannerT = dur || 1.8;
}

// ---------- player ----------
var player = {
  x: VW / 2, alive: true, respawnT: 0, invulnT: 0, fireT: 0, flashT: 0, tilt: 0
};
var PLAYER_SPEED = 430;

// ---------- projectiles ----------
var bolts = [];  // player bolts {x, y, alive}
var bombs = [];  // invader bombs {x, y, alive, trailT}
function getBolt() {
  for (var i = 0; i < bolts.length; i++) if (!bolts[i].alive) return bolts[i];
  if (bolts.length < 24) { var b = { x: 0, y: 0, alive: false }; bolts.push(b); return b; }
  return null;
}
function getBomb() {
  for (var i = 0; i < bombs.length; i++) if (!bombs[i].alive) return bombs[i];
  if (bombs.length < 30) { var b = { x: 0, y: 0, alive: false, trailT: 0 }; bombs.push(b); return b; }
  return null;
}

// ---------- invader formation ----------
var COLS = 10, ROWS = 5, INV_DX = 66, INV_DY = 50;
var FORM_W = (COLS - 1) * INV_DX + INV_W;
var form = { x: 0, y: 0, dir: 1, alive: 0, grid: [] };
function spawnFormation() {
  form.x = (VW - FORM_W) / 2;
  form.y = 104 + Math.min((state.wave - 1) * 13, 78);
  form.dir = 1;
  form.grid = [];
  form.alive = COLS * ROWS;
  for (var r = 0; r < ROWS; r++) {
    form.grid.push([]);
    for (var c = 0; c < COLS; c++) form.grid[r].push(true);
  }
  bombs.forEach(function (b) { b.alive = false; });
}
function invaderPos(r, c) {
  return { x: form.x + c * INV_DX, y: form.y + r * INV_DY };
}
function formationSpeed() {
  var deadFrac = 1 - form.alive / (COLS * ROWS);
  return 13 + state.wave * 1.6 + deadFrac * deadFrac * 52;
}
function bottomInvaderY() {
  for (var r = ROWS - 1; r >= 0; r--) {
    for (var c = 0; c < COLS; c++) {
      if (form.grid[r][c]) return form.y + r * INV_DY + INV_H;
    }
  }
  return 0;
}

// ---------- mothership ----------
var moth = { active: false, x: 0, dir: 1, timer: rand(16, 26), warbleT: 0, warbleHi: false };

// ---------- flow ----------
function startGame() {
  state.mode = 'play';
  state.paused = false;
  state.score = 0;
  state.wave = 1;
  state.shipsLost = 0;
  state.waveTimer = -1;
  player.x = VW / 2; player.alive = true; player.invulnT = 0; player.respawnT = 0;
  bolts.forEach(function (b) { b.alive = false; });
  moth.active = false; moth.timer = rand(18, 28);
  buildShields();
  spawnFormation();
  showBanner('WAVE 1', 'Unlimited ships. Endless waves. Good hunting.', 2.2);
  document.getElementById('startScreen').classList.add('hidden');
}
function playerDie() {
  player.alive = false;
  player.respawnT = 1.4;
  player.invulnT = 0;
  state.shipsLost++;
  state.shake = Math.max(state.shake, 15);
  spawnParticles(player.x, PLAYER_Y, '#27e8ff', 46, 260, 0.9, 9, 130);
  spawnParticles(player.x, PLAYER_Y, '#ff3df0', 26, 190, 0.7, 7, 90);
  spawnParticles(player.x, PLAYER_Y, '#ffffff', 16, 320, 0.5, 6, 0);
  AudioSys.boom(true);
  bombs.forEach(function (b) { b.alive = false; }); // mercy: clear the sky
}
function invadersLanded() {
  state.shipsLost++;
  state.shake = Math.max(state.shake, 12);
  AudioSys.thud();
  showBanner('THEY LANDED!', 'Formation reset — one ship lost. The waves never stop.', 2.4);
  spawnFormation(); // same wave, back to the top
}

// ---------- updates ----------
function updatePlayer(dt) {
  if (!player.alive) {
    player.respawnT -= dt;
    if (player.respawnT <= 0) {
      player.alive = true;
      player.x = VW / 2;
      player.invulnT = 2.0;
    }
    return;
  }
  if (player.invulnT > 0) player.invulnT -= dt;
  pollGamepad();
  var move = 0;
  if (keys['ArrowLeft'] || keys['KeyA']) move -= 1;
  if (keys['ArrowRight'] || keys['KeyD']) move += 1;
  if (move === 0 && pad.move !== 0) move = pad.move;
  if (move !== 0) {
    player.x += move * PLAYER_SPEED * dt;
    pointer.active = false; // keyboard/stick take over from the pointer
  } else if (pointer.active) {
    var target = clamp(pointer.x, 30, VW - 30);
    var diff = target - player.x;
    player.x += clamp(diff, -PLAYER_SPEED * 1.7 * dt, PLAYER_SPEED * 1.7 * dt);
  }
  player.x = clamp(player.x, 30, VW - 30);
  player.tilt = lerp(player.tilt, move !== 0 ? move : clamp(diff || 0, -1, 1) * (pointer.active ? 1 : 0), 0.25);

  // firing
  player.fireT -= dt;
  var wantFire = keys['Space'] || pointer.down || pad.fire;
  if (wantFire && player.fireT <= 0) {
    var b = getBolt();
    if (b) {
      b.x = player.x; b.y = PLAYER_Y - 26; b.alive = true;
      player.fireT = 0.16;
      player.flashT = 0.05;
      spawnParticles(player.x, PLAYER_Y - 26, '#27e8ff', 2, 60, 0.16, 4, 0);
      AudioSys.laser();
    }
  }
  if (player.flashT > 0) player.flashT -= dt;
}

function updateBolts(dt) {
  for (var i = 0; i < bolts.length; i++) {
    var b = bolts[i];
    if (!b.alive) continue;
    b.y -= 640 * dt;
    if (b.y < 58) { b.alive = false; continue; }
    // bolt vs mothership
    if (moth.active && Math.abs(b.x - moth.x) < MOTH_W / 2 && Math.abs(b.y - 52) < MOTH_H / 2) {
      b.alive = false;
      killMothership();
      continue;
    }
    // bolt vs invaders
    var hitDone = false;
    for (var r = 0; r < ROWS && !hitDone; r++) {
      for (var c = 0; c < COLS && !hitDone; c++) {
        if (!form.grid[r][c]) continue;
        var p = invaderPos(r, c);
        if (b.x > p.x - 3 && b.x < p.x + INV_W + 3 && b.y > p.y - 4 && b.y < p.y + INV_H + 4) {
          b.alive = false; hitDone = true;
          killInvader(r, c, p);
        }
      }
    }
    if (hitDone) continue;
    // bolt vs bombs (shoot their bombs out of the sky, classic style)
    for (var j = 0; j < bombs.length; j++) {
      var bm = bombs[j];
      if (bm.alive && Math.abs(b.x - bm.x) < 9 && Math.abs(b.y - bm.y) < 13) {
        bm.alive = false; b.alive = false;
        addScore(1);
        spawnParticles(bm.x, bm.y, '#ff5470', 6, 90, 0.3, 5, 0);
        AudioSys.blip();
        hitDone = true;
        break;
      }
    }
    if (hitDone || !b.alive) continue;
    // bolt vs shields (your own bunkers erode too)
    var sh = pointInShield(b.x, b.y - 4);
    if (sh) {
      erodeShield(sh, b.x, b.y - 4, 10);
      b.alive = false;
      spawnParticles(b.x, b.y, '#2bff88', 3, 50, 0.2, 4, 0);
    }
  }
}
function killInvader(r, c, p) {
  form.grid[r][c] = false;
  form.alive--;
  var style = ROW_STYLE[r];
  addScore(style.points);
  spawnParticles(p.x + INV_W / 2, p.y + INV_H / 2, style.color, 15, 170, 0.55, 7, 60);
  spawnParticles(p.x + INV_W / 2, p.y + INV_H / 2, '#ffffff', 5, 120, 0.3, 5, 0);
  AudioSys.blip();
  state.shake = Math.max(state.shake, 2.5);
  if (form.alive <= 0 && state.waveTimer < 0) {
    state.wave++;
    state.waveTimer = 1.9;
    showBanner('WAVE ' + state.wave, pick(['They keep coming.', 'Faster now.', 'Hold the line.', 'Endless waves, endless ships.']), 1.9);
    buildShields(); // fresh bunkers each wave
  }
}
function killMothership() {
  moth.active = false;
  moth.timer = rand(25, 40);
  var bonus = pick([50, 100, 100, 150, 200, 300]);
  addScore(bonus);
  spawnParticles(moth.x, 52, '#ff5470', 42, 240, 0.8, 9, 90);
  spawnParticles(moth.x, 52, '#ffe27a', 20, 170, 0.6, 7, 60);
  showBanner('+' + bonus, 'Mothership down!', 1.1);
  AudioSys.boom(false);
  state.shake = Math.max(state.shake, 7);
}

function updateBombs(dt) {
  var speed = 235 + state.wave * 9;
  for (var i = 0; i < bombs.length; i++) {
    var bm = bombs[i];
    if (!bm.alive) continue;
    bm.y += speed * dt;
    bm.trailT -= dt;
    if (bm.trailT <= 0) {
      bm.trailT = 0.05;
      spawnParticles(bm.x, bm.y - 6, '#ff5470', 1, 14, 0.28, 4, -30);
    }
    // bomb vs shields
    var sh = pointInShield(bm.x, bm.y + 5);
    if (sh) {
      erodeShield(sh, bm.x, bm.y + 5, 12);
      bm.alive = false;
      spawnParticles(bm.x, bm.y, '#2bff88', 5, 70, 0.25, 5, 40);
      continue;
    }
    if (bm.y >= GROUND_Y - 4) {
      bm.alive = false;
      spawnParticles(bm.x, GROUND_Y, '#ff5470', 4, 60, 0.25, 4, -40);
      continue;
    }
    // bomb vs player
    if (player.alive && player.invulnT <= 0 &&
        Math.abs(bm.x - player.x) < 24 && bm.y > PLAYER_Y - 14 && bm.y < PLAYER_Y + 16) {
      bm.alive = false;
      playerDie();
    }
  }
  // invader bombing runs
  bombClock -= dt;
  if (bombClock <= 0 && form.alive > 0) {
    bombClock = Math.max(0.24, 0.95 - state.wave * 0.06 - (1 - form.alive / 50) * 0.3) * rand(0.6, 1.25);
    // shooters: bottom-most living invader of a few random columns
    var shooters = 0, guard = 0;
    while (shooters < (state.wave >= 4 ? 2 : 1) && guard++ < 14) {
      var c = randi(0, COLS - 1), r = ROWS - 1;
      while (r >= 0 && !form.grid[r][c]) r--;
      if (r < 0) continue;
      var p = invaderPos(r, c);
      var nb = getBomb();
      if (nb) { nb.x = p.x + INV_W / 2; nb.y = p.y + INV_H + 4; nb.alive = true; nb.trailT = 0; shooters++; }
    }
  }
}
var bombClock = 0.8;

function updateFormation(dt) {
  if (state.waveTimer >= 0) {
    state.waveTimer -= dt;
    if (state.waveTimer < 0) spawnFormation();
    return;
  }
  if (form.alive <= 0) return;
  var sp = formationSpeed();
  form.x += form.dir * sp * dt;
  // edge detection across living invaders
  var minX = Infinity, maxX = -Infinity;
  for (var r = 0; r < ROWS; r++) {
    for (var c = 0; c < COLS; c++) {
      if (!form.grid[r][c]) continue;
      var p = invaderPos(r, c);
      if (p.x < minX) minX = p.x;
      if (p.x + INV_W > maxX) maxX = p.x + INV_W;
    }
  }
  if (minX < 26 && form.dir < 0) { form.dir = 1; form.y += 17; }
  else if (maxX > VW - 26 && form.dir > 0) { form.dir = -1; form.y += 17; }
  // invaders munch through any bunker they overrun
  eatClock -= dt;
  if (eatClock <= 0) {
    eatClock = 0.22;
    for (var r2 = 0; r2 < ROWS; r2++) {
      for (var c2 = 0; c2 < COLS; c2++) {
        if (!form.grid[r2][c2]) continue;
        var ip = invaderPos(r2, c2);
        if (ip.y + INV_H >= SHIELD_Y && ip.y <= SHIELD_Y + SHIELD_H) {
          for (var s2 = 0; s2 < shields.length; s2++) {
            erodeShield(shields[s2], ip.x + INV_W / 2, ip.y + INV_H - 2, 11);
          }
        }
      }
    }
  }
  if (bottomInvaderY() >= 618) invadersLanded();
}
var eatClock = 0;

function updateMothership(dt) {
  if (moth.active) {
    moth.x += moth.dir * 135 * dt;
    moth.warbleT -= dt;
    if (moth.warbleT <= 0) {
      moth.warbleT = 0.21;
      moth.warbleHi = !moth.warbleHi;
      AudioSys.warble(moth.warbleHi);
    }
    if (moth.x < -70 || moth.x > VW + 70) { moth.active = false; moth.timer = rand(25, 40); }
  } else if (state.mode === 'play' && state.waveTimer < 0) {
    moth.timer -= dt;
    if (moth.timer <= 0) {
      moth.active = true;
      moth.dir = Math.random() < 0.5 ? 1 : -1;
      moth.x = moth.dir > 0 ? -50 : VW + 50;
      moth.warbleT = 0;
    }
  }
}
// ---------- rendering ----------
function drawBackground(dt) {
  blit(nebula, 0, 0, VW, VH);
  var layers = [starsFar, starsMid, starsNear];
  for (var i = 0; i < 3; i++) {
    starScroll[i] = (starScroll[i] + STAR_SPEEDS[i] * dt) % VH;
    ctx.globalAlpha = 0.55 + i * 0.2;
    blit(layers[i], 0, starScroll[i] - VH, VW, VH);
    blit(layers[i], 0, starScroll[i], VW, VH);
  }
  ctx.globalAlpha = 1;
}
function drawGround() {
  var gr = ctx.createLinearGradient(0, GROUND_Y, 0, GROUND_Y + 3);
  gr.addColorStop(0, 'rgba(39,232,255,0.95)');
  gr.addColorStop(1, 'rgba(39,232,255,0)');
  ctx.fillStyle = gr;
  ctx.fillRect(24, GROUND_Y, VW - 48, 3);
  ctx.fillStyle = 'rgba(39,232,255,0.07)';
  ctx.fillRect(24, GROUND_Y + 3, VW - 48, VH - GROUND_Y);
}
function drawShields() {
  for (var i = 0; i < shields.length; i++) {
    var sh = shields[i];
    if (sh.dirty) renderShield(sh);
    if (sh.count > 0) ctx.drawImage(sh.canvas, sh.x, sh.y, SHIELD_W, SHIELD_H);
  }
}
function drawPlayer() {
  if (!player.alive) return;
  if (player.invulnT > 0 && Math.floor(state.time * 14) % 2 === 0) return; // blink
  ctx.save();
  ctx.translate(player.x, PLAYER_Y);
  ctx.rotate(player.tilt * 0.10);
  if (player.flashT > 0) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.9;
    var fs = 26;
    ctx.drawImage(glowDots['#27e8ff'], -fs / 2, -34 - fs / 2, fs, fs);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
  // engine glow
  ctx.globalCompositeOperation = 'lighter';
  var flick = 15 + Math.sin(state.time * 31) * 3;
  ctx.drawImage(glowDots['#27e8ff'], -flick / 2, 14, flick, flick + 8);
  ctx.globalCompositeOperation = 'source-over';
  blit(shipSprite, -SHIP_W / 2, -SHIP_H / 2, SHIP_W, SHIP_H);
  ctx.restore();
}
function drawInvaders() {
  if (state.waveTimer >= 0 || form.alive <= 0) return;
  for (var r = 0; r < ROWS; r++) {
    for (var c = 0; c < COLS; c++) {
      if (!form.grid[r][c]) continue;
      var p = invaderPos(r, c);
      var bob = Math.sin(state.time * 2.1 + c * 0.55 + r * 0.3) * 2;
      var pulse = 1 + 0.045 * Math.sin(state.time * 3.2 + (r + c) * 0.4);
      var w = INV_W * pulse, h = INV_H * pulse;
      blit(invaderSprites[r], p.x + INV_W / 2 - w / 2, p.y + bob + INV_H / 2 - h / 2, w, h);
    }
  }
}
function drawProjectiles() {
  var i, b;
  ctx.globalCompositeOperation = 'lighter';
  for (i = 0; i < bolts.length; i++) {
    b = bolts[i];
    if (b.alive) blit(boltSprite, b.x - 4, b.y - 22, 8, 26);
  }
  ctx.globalCompositeOperation = 'source-over';
  for (i = 0; i < bombs.length; i++) {
    b = bombs[i];
    if (b.alive) blit(bombSprite, b.x - 9, b.y - 9, 18, 18);
  }
}
function drawMothership() {
  if (!moth.active) return;
  var bob = Math.sin(state.time * 5) * 2;
  blit(mothSprite, moth.x - MOTH_W / 2, 52 - MOTH_H / 2 + bob, MOTH_W, MOTH_H);
}
function drawHUD() {
  ctx.textBaseline = 'alphabetic';
  ctx.font = '700 19px "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = '#8fb4d9';
  ctx.textAlign = 'left';
  ctx.fillText('SCORE', 26, 30);
  ctx.fillStyle = '#ffffff';
  ctx.font = '800 24px "Segoe UI", system-ui, sans-serif';
  ctx.fillText(String(state.score), 26, 56);
  ctx.textAlign = 'center';
  ctx.font = '700 15px "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = '#8fb4d9';
  ctx.fillText('BEST  ' + state.high, VW / 2, 30);
  ctx.textAlign = 'right';
  ctx.fillText('WAVE', VW - 26, 30);
  ctx.fillStyle = '#ffffff';
  ctx.font = '800 24px "Segoe UI", system-ui, sans-serif';
  ctx.fillText(String(state.wave), VW - 26, 56);
  // bottom strip: the whole point of this build — ships are endless
  ctx.textAlign = 'left';
  ctx.font = '700 15px "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = '#2bff88';
  ctx.fillText('SHIPS: ∞ UNLIMITED', 26, VH - 10);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#ff8fa8';
  ctx.fillText('SHIPS LOST: ' + state.shipsLost, VW - 26, VH - 10);
}
function drawBanner() {
  if (state.bannerT <= 0) return;
  var a = clamp(state.bannerT / 0.45, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '900 52px "Segoe UI", system-ui, sans-serif';
  ctx.shadowColor = '#27e8ff'; ctx.shadowBlur = 26;
  ctx.fillStyle = '#eafcff';
  ctx.fillText(state.bannerText, VW / 2, 300);
  if (state.bannerSub) {
    ctx.font = '600 19px "Segoe UI", system-ui, sans-serif';
    ctx.shadowBlur = 10;
    ctx.fillStyle = '#bfeaff';
    ctx.fillText(state.bannerSub, VW / 2, 336);
  }
  ctx.restore();
}
function drawPaused() {
  ctx.fillStyle = 'rgba(3,2,14,0.66)';
  ctx.fillRect(0, 0, VW, VH);
  ctx.textAlign = 'center';
  ctx.font = '900 46px "Segoe UI", system-ui, sans-serif';
  ctx.shadowColor = '#9d5cff'; ctx.shadowBlur = 22;
  ctx.fillStyle = '#efeaff';
  ctx.fillText('PAUSED', VW / 2, 330);
  ctx.shadowBlur = 0;
  ctx.font = '600 17px "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = '#bdb2e8';
  ctx.fillText('Press P or tap the pause button to keep flying', VW / 2, 366);
}

// ---------- main loop ----------
var lastT = 0;
function frame(nowMs) {
  requestAnimationFrame(frame);
  var now = nowMs / 1000;
  var dt = Math.min(now - (lastT || now), 0.033);
  lastT = now;

  var playing = state.mode === 'play' && !state.paused;
  if (playing) {
    state.time += dt;
    updatePlayer(dt);
    updateBolts(dt);
    updateBombs(dt);
    updateFormation(dt);
    updateMothership(dt);
    if (state.bannerT > 0) state.bannerT -= dt;
  } else {
    state.time += dt * 0.25; // menu / pause: background drifts slowly
  }
  updateParticles(dt);
  if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 26);

  // ---- draw ----
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.fillStyle = '#04020c';
  ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
  var sx = 0, sy = 0;
  if (state.shake > 0) {
    sx = rand(-state.shake, state.shake) * 0.55;
    sy = rand(-state.shake, state.shake) * 0.55;
  }
  ctx.setTransform(view.dpr * view.scale, 0, 0, view.dpr * view.scale,
    view.dpr * (view.ox + sx * view.scale), view.dpr * (view.oy + sy * view.scale));
  drawBackground(playing ? dt : dt * 0.25);
  if (state.mode === 'play') {
    drawGround();
    drawShields();
    drawInvaders();
    drawMothership();
    drawProjectiles();
    drawPlayer();
    drawParticles();
    drawHUD();
    drawBanner();
    if (state.paused) drawPaused();
  } else {
    drawParticles();
  }
}
requestAnimationFrame(frame);

// ---------- UI wiring ----------
var startScreen = document.getElementById('startScreen');
var startBtn = document.getElementById('startBtn');
var muteBtn = document.getElementById('muteBtn');
var pauseBtn = document.getElementById('pauseBtn');
var bestLine = document.getElementById('bestLine');
function refreshBest() {
  bestLine.textContent = state.high > 0 ? 'BEST SCORE: ' + state.high : '';
}
refreshBest();
function toggleMute() {
  AudioSys.muted = !AudioSys.muted;
  muteBtn.innerHTML = AudioSys.muted ? '&#128263;' : '&#128266;';
}
function setPaused(p) {
  if (state.mode !== 'play') return;
  state.paused = p;
}
function togglePause() {
  if (state.mode !== 'play') return;
  state.paused = !state.paused;
}
muteBtn.addEventListener('click', function () { AudioSys.init(); toggleMute(); });
pauseBtn.addEventListener('click', function () { AudioSys.init(); togglePause(); });
startBtn.addEventListener('click', function () { AudioSys.init(); startGame(); refreshBest(); startBtn.blur(); });
window.addEventListener('keydown', function (e) {
  if (state.mode === 'menu' && (e.code === 'Enter' || e.code === 'Space')) {
    AudioSys.init(); startGame(); refreshBest();
  }
});
// ambient menu sparkles so the start screen feels alive behind the panel
setInterval(function () {
  if (state.mode === 'menu') {
    spawnParticles(rand(60, VW - 60), rand(80, VH - 120), pick(PALETTE), 3, 40, 1.4, 6, -12);
  }
}, 420);
buildShields(); // so a fresh page load never draws an empty bunker row mid-frame
</script>
</body>
</html>
